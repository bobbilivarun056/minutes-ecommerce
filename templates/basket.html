<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minutes | Checkout Basket</title>
    <style>
        /* --- Sky Blue Oil Painting Canvas Theme --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e3edf7; 
            background-image: radial-gradient(circle at 50% 50%, #f0f7ff 0%, #cbdcf0 100%);
            color: #1e293b; 
            font-family: 'Georgia', 'Times New Roman', serif;
            padding-bottom: 50px;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0f2b48 0%, #051424 100%); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            border-bottom: 3px solid #d4af37;
            box-shadow: 0 4px 15px rgba(5, 20, 36, 0.25);
        }

        .navbar-brand {
            color: #f4efe6;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .cart-section {
            flex: 2;
            min-width: 320px;
        }

        .price-section {
            flex: 1;
            min-width: 300px;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #0f2b48;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
        }

        .custom-box {
            background: #ffffff;
            border: 1px solid #b8cde3; 
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 12px rgba(15, 43, 72, 0.08);
            margin-bottom: 20px;
        }

        .cart-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .cart-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-weight: bold;
            color: #1e293b;
        }

        .item-price {
            color: #a6422f; 
            font-weight: 600;
            font-size: 17px;
        }

        .address-textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-family: Arial, sans-serif;
            resize: none;
            margin-top: 5px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-buy {
            background: linear-gradient(135deg, #ff9f00 0%, #e68f00 100%); 
            color: white;
            box-shadow: 0 2px 6px rgba(230, 143, 0, 0.3);
        }

        .btn-buy:hover { background: #cc7e00; }

        .btn-empty {
            background: transparent;
            border: 1px solid #a6422f;
            color: #a6422f;
            padding: 6px 15px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .total-row {
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #0f2b48;
        }
        
        .text-success { color: #15803d; font-weight: bold; }
        .text-link { display: block; margin-top: 20px; color: #0f2b48; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <a class="navbar-brand" href="/">Minutes Secure Checkout</a>
    </nav>

    <div class="container">
        <div class="cart-section">
            <h3 class="page-title">Your Shopping Cart</h3>
            <div class="custom-box">
                <ul id="cart-list" class="cart-list"></ul>
                <button class="btn-empty" onclick="clearCart()">Empty All Basket Items</button>
            </div>

            <h3 class="page-title" style="margin-top: 30px;">Delivery Address</h3>
            <div class="custom-box">
                <label style="font-weight: bold; font-size: 14px;">Enter Complete Address:</label>
                <textarea id="deliveryAddress" class="address-textarea" placeholder="Type your delivery address details here..."></textarea>
            </div>
            <a href="/" class="text-link">← Continue Shopping</a>
        </div>

        <div class="price-section">
            <h3 class="page-title">Price Details</h3>
            <div class="custom-box">
                <div class="price-row">
                    <span>Selected Items Subtotal:</span>
                    <span class="item-price">₹<span id="subtotal-val">0</span></span>
                </div>
                <div class="price-row text-success">
                    <span>Delivery Charges:</span>
                    <span>FREE</span>
                </div>
                <div class="price-row total-row">
                    <span>Total Amount:</span>
                    <span>₹<span id="total-val">0</span></span>
                </div>
                <button class="btn-action btn-buy" style="margin-top: 20px;" onclick="checkout()">Place Order via COD</button>
            </div>
        </div>
    </div>

    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('minutes_cart')) || [];
            const list = document.getElementById('cart-list');
            let sum = 0;
            list.innerHTML = "";

            if(cart.length === 0) {
                list.innerHTML = "<div style='text-align: center; padding: 20px; color: #64748b;'>Your shopping cart is completely empty.</div>";
                document.getElementById('subtotal-val').innerText = "0";
                document.getElementById('total-val').innerText = "0";
                return;
            }

            cart.forEach(item => {
                list.innerHTML += `
                    <li class="cart-item">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">₹${item.price}</span>
                    </li>`;
                sum += parseFloat(item.price);
            });
            document.getElementById('subtotal-val').innerText = sum;
            document.getElementById('total-val').innerText = sum;
        }

        function clearCart() {
            localStorage.removeItem('minutes_cart');
            document.getElementById('deliveryAddress').value = "";
            renderCart();
        }

        // --- CONNECTED CHECKOUT FUNCTION (FULLY FIXED & RE-CLOSED) ---
        async function checkout() {
            let cart = JSON.parse(localStorage.getItem('minutes_cart')) || [];
            
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const addressInput = document.getElementById('deliveryAddress').value.trim();
            if (!addressInput) {
                alert("⚠️ Please enter a delivery address before placing your order!");
                return;
            }

            let totalSum = document.getElementById('total-val').innerText;

            try {
                // Send order data using relative cloud endpoints
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cart: cart,
                        address: addressInput,
                        total: totalSum
                    })
                });

                if (response.ok) {
                    alert(`🎉 Success! Your order has been placed.\nAn email confirmation summary has been processed.\n\nEstimated delivery: 30 Minutes.`);
                    clearCart();
                } else {
                    alert("Order placement failed on live server routing.");
                }
            } catch (err) {
                alert("Network communication error with the live application backend.");
            }
        }

        renderCart();
    </script>
</body>
</html>
